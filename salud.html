<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vitalis · Kardex inteligente</title>
<link rel="icon" href="/salud/logo.png">
<style>
:root{
  --primary:#0e7490;
  --primary-dark:#134e5e;
  --accent:#06b6d4;
  --accent-2:#22d3ee;
  --bg:#f0f5f7;
  --card:#ffffff;
  --border:#dbe6ea;
  --text:#0f2733;
  --text-muted:#5b7480;
  --success:#15803d; --success-bg:rgba(21,128,61,.1);
  --warning:#b45309; --warning-bg:rgba(180,83,9,.1);
  --danger:#b91c1c; --danger-bg:rgba(185,28,28,.08);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
.header{background:var(--card);padding:16px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;}
.header .brand{display:flex;align-items:center;gap:10px;}
.header .logo{width:36px;height:36px;object-fit:contain;}
.header h1{font-size:18px;color:var(--primary);}
.header p{font-size:12px;color:var(--text-muted);margin-top:2px;}
.header button{background:none;border:1px solid var(--border);color:var(--text-muted);border-radius:8px;padding:6px 12px;font-size:12px;}
.wrap{max-width:480px;width:100%;margin:0 auto;padding:16px;flex:1;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,39,51,.05);}
label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px;margin-top:14px;}
label:first-child{margin-top:0;}
input,select{width:100%;background:#f7fafb;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:11px;font-size:14px;}
input:focus,select:focus{outline:none;border-color:var(--primary);}
button{font-family:inherit;}
button.primary{width:100%;background:var(--primary);color:#fff;border:none;border-radius:8px;padding:13px;font-size:15px;font-weight:600;margin-top:18px;}
button.primary:disabled{opacity:.5;}
button.secondary{width:100%;background:#e6f3f6;border:1px solid var(--border);color:var(--primary);border-radius:8px;padding:12px;font-size:14px;margin-top:10px;font-weight:600;}
button.link{background:none;border:none;color:var(--primary);font-size:13px;margin-top:16px;width:100%;text-align:center;}
.error{background:var(--danger-bg);border:1px solid rgba(185,28,28,.25);color:var(--danger);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:14px;}
.hint{font-size:12px;color:var(--text-muted);margin-top:8px;}
.item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(15,39,51,.05);cursor:pointer;}
.item .top{display:flex;justify-content:space-between;align-items:center;}
.item .nombre{font-size:15px;font-weight:600;}
.item .fecha{font-size:11px;color:var(--text-muted);margin-top:4px;}
.item .preview{font-size:12px;color:var(--text-muted);margin-top:6px;}
.badge{font-size:11px;padding:3px 9px;border-radius:12px;white-space:nowrap;font-weight:600;}
.badge-procesando{background:var(--warning-bg);color:var(--warning);}
.badge-completado{background:var(--success-bg);color:var(--success);}
.badge-error{background:var(--danger-bg);color:var(--danger);}
.empty{color:var(--text-muted);text-align:center;padding:50px 20px;font-size:13px;}
.loading{text-align:center;padding:60px 20px;color:var(--text-muted);}
.file-label{display:block;text-align:center;border:1px dashed var(--border);border-radius:8px;padding:14px;font-size:13px;color:var(--text-muted);margin-top:10px;cursor:pointer;}
.segmento{border-radius:12px;padding:10px 14px;margin-bottom:10px;max-width:88%;}
.segmento.h0{background:#e6f3f6;margin-right:auto;}
.segmento.h1{background:#eef2e6;margin-left:auto;}
.segmento .quien{font-size:11px;color:var(--text-muted);margin-bottom:4px;font-weight:600;}
.segmento .texto{font-size:14px;line-height:1.4;}
.back{background:none;border:none;color:var(--primary);font-size:13px;margin-bottom:14px;font-weight:600;}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:16px;overflow-x:auto;}
.tab{flex:0 0 auto;background:none;border:none;padding:10px 14px;font-size:13px;font-weight:600;color:var(--text-muted);border-radius:7px;white-space:nowrap;}
.tab.activo{background:var(--primary);color:#fff;}
.seccion-titulo{font-size:12px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.4px;margin:20px 0 8px;}
.nota-titulo{font-size:13px;font-weight:700;color:var(--primary);margin-bottom:10px;}
.nota-campo{font-size:13px;line-height:1.5;margin-bottom:8px;}
.nota-campo b{color:var(--text);}
.paciente-info{font-size:13px;color:var(--text-muted);margin-top:4px;line-height:1.5;}
.avatar-card{text-align:center;}
.avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(160deg,var(--accent-2),var(--primary));color:#fff;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;}
.stats-row{display:flex;gap:10px;margin-bottom:14px;}
.stat{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 8px;text-align:center;box-shadow:0 1px 3px rgba(15,39,51,.05);}
.stat-num{font-size:18px;font-weight:700;color:var(--primary);}
.stat-lbl{font-size:11px;color:var(--text-muted);margin-top:2px;}
.dato-row{font-size:14px;padding:9px 0;border-bottom:1px solid var(--border);}
.dato-row:last-child{border-bottom:none;}
.brief-card{background:linear-gradient(135deg,#e6f7fa,#f0f9fa);border:1px solid var(--accent-2);}
.brief-alerta{color:var(--danger);}

/* ─── Panel "escuchando" con onda de voz, estilo asistente clínico ────── */
.listen-panel{display:none;background:linear-gradient(160deg,var(--primary-dark),#0a2e38);border-radius:16px;padding:22px 18px;text-align:center;color:#fff;margin-bottom:16px;}
.listen-panel canvas{width:100%;height:70px;display:block;}
.listen-time{font-size:26px;font-family:ui-monospace,monospace;margin-top:6px;letter-spacing:1px;}
.listen-label{font-size:12px;opacity:.75;margin-top:2px;letter-spacing:.4px;}
.live-caption{font-size:14px;line-height:1.5;color:#fff;opacity:.92;margin-top:14px;text-align:left;min-height:20px;max-height:120px;overflow-y:auto;}
.rec-box{text-align:center;padding:6px 0;}
.rec-btn{width:80px;height:80px;border-radius:50%;border:none;background:var(--primary);color:#fff;font-size:28px;margin:6px auto;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(14,116,144,.35);}
.rec-btn.recording{background:var(--danger);animation:pulse 1.6s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(185,28,28,.45);}70%{box-shadow:0 0 0 16px rgba(185,28,28,0);}100%{box-shadow:0 0 0 0 rgba(185,28,28,0);}}
.rec-status{font-size:13px;color:var(--text-muted);margin-top:8px;}

.footer{text-align:center;font-size:11px;color:var(--text-muted);padding:18px 16px 22px;}
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <img src="/salud/logo.png" alt="Vitalis" class="logo">
    <div>
      <h1>Vitalis</h1>
      <p id="headerSub">Kardex inteligente</p>
    </div>
  </div>
  <button id="btnLogout" style="display:none">Salir</button>
</div>

<div class="wrap" id="app">
  <div class="loading">⏳ Cargando...</div>
</div>

<div class="footer">Powered by ChatGo</div>

<script>
const API = ""; // mismo dominio que la API — se sirve desde /salud
let TOKEN = localStorage.getItem("salud_token") || null;
let MEDICO_NOMBRE = localStorage.getItem("salud_nombre") || "";
const app = document.getElementById("app");
const headerSub = document.getElementById("headerSub");
const btnLogout = document.getElementById("btnLogout");

// La transcripción y la nota clínica de consultas largas corren en segundo
// plano en el servidor; mientras no terminan, la pantalla se refresca sola.
let pollTimeout = null;
function detenerPolling() { if (pollTimeout) { clearTimeout(pollTimeout); pollTimeout = null; } }

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function edadDesde(fechaNacimiento) {
  if (!fechaNacimiento) return null;
  const nac = new Date(fechaNacimiento);
  const hoy = new Date();
  let edad = hoy.getFullYear() - nac.getFullYear();
  const m = hoy.getMonth() - nac.getMonth();
  if (m < 0 || (m === 0 && hoy.getDate() < nac.getDate())) edad--;
  return edad;
}

function iniciales(nombre) {
  const partes = String(nombre || "").trim().split(/\s+/);
  return ((partes[0]?.[0] || "") + (partes[1]?.[0] || "")).toUpperCase();
}

function fmt(s){ const m=String(Math.floor(s/60)).padStart(2,"0"); const r=String(s%60).padStart(2,"0"); return m+":"+r; }

// Dibuja la onda de voz en vivo sobre un <canvas>, a partir de un MediaStream
// del micrófono. Se usa tanto grabando local (compu con micrófono) como en
// el celular vinculado como micrófono remoto.
function crearVisualizadorOnda(waveCanvas) {
  let audioCtx = null, analyser = null, dataArray = null, animId = null;

  function dibujar() {
    animId = requestAnimationFrame(dibujar);
    analyser.getByteFrequencyData(dataArray);
    const ctx = waveCanvas.getContext("2d");
    const w = waveCanvas.width, h = waveCanvas.height;
    ctx.clearRect(0, 0, w, h);
    const bars = 32;
    const step = Math.floor(dataArray.length / bars);
    const barWidth = w / bars;
    for (let i = 0; i < bars; i++) {
      const value = dataArray[i * step] / 255;
      const barHeight = Math.max(4, value * h * 0.9);
      const x = i * barWidth;
      const y = (h - barHeight) / 2;
      const grad = ctx.createLinearGradient(0, y, 0, y + barHeight);
      grad.addColorStop(0, "#22d3ee");
      grad.addColorStop(1, "#0891b2");
      ctx.fillStyle = grad;
      const bw = barWidth * 0.6, r = bw / 2;
      const bx = x + barWidth * 0.2;
      ctx.beginPath();
      ctx.moveTo(bx + r, y);
      ctx.arcTo(bx + bw, y, bx + bw, y + barHeight, r);
      ctx.arcTo(bx + bw, y + barHeight, bx, y + barHeight, r);
      ctx.arcTo(bx, y + barHeight, bx, y, r);
      ctx.arcTo(bx, y, bx + bw, y, r);
      ctx.closePath();
      ctx.fill();
    }
  }

  return {
    iniciar(stream) {
      const dpr = window.devicePixelRatio || 1;
      const rect = waveCanvas.getBoundingClientRect();
      waveCanvas.width = rect.width * dpr;
      waveCanvas.height = rect.height * dpr;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      source.connect(analyser);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      dibujar();
    },
    detener() {
      if (animId) cancelAnimationFrame(animId);
      if (audioCtx) audioCtx.close();
      audioCtx = null; analyser = null;
    },
  };
}

// Sube el audio grabado/subido y crea la consulta. Se usa tanto grabando
// local como desde el celular vinculado como micrófono remoto.
async function subirConsulta(pacienteId, blob, mimeType) {
  return api("/medico/consultas?pacienteId=" + encodeURIComponent(pacienteId), {
    method: "POST",
    headers: { "Content-Type": mimeType || "audio/webm" },
    body: blob,
  });
}

// Vista previa en vivo: mientras se graba (para el archivo real, que es lo
// que se guarda), en paralelo se manda el audio en crudo (PCM 16kHz) al
// WebSocket de AssemblyAI para mostrar el texto apareciendo mientras se
// habla. Si esto falla por lo que sea, no afecta la grabación real — es
// solo decorativo, la transcripción de verdad sigue viniendo del archivo
// subido al terminar.
function crearTranscriptorEnVivo(onTexto) {
  let ws = null, audioCtx = null, workletNode = null, source = null;

  const CODIGO_WORKLET = `
    class PCMWorklet extends AudioWorkletProcessor {
      constructor() {
        super();
        this.ratio = sampleRate / 16000;
      }
      process(inputs) {
        const input = inputs[0][0];
        if (input && input.length) {
          const outLen = Math.max(1, Math.floor(input.length / this.ratio));
          const buf = new Int16Array(outLen);
          for (let i = 0; i < outLen; i++) {
            const srcIdx = i * this.ratio;
            const i0 = Math.floor(srcIdx);
            const i1 = Math.min(i0 + 1, input.length - 1);
            const frac = srcIdx - i0;
            const sample = input[i0] * (1 - frac) + input[i1] * frac;
            const s = Math.max(-1, Math.min(1, sample));
            buf[i] = s < 0 ? s * 32768 : s * 32767;
          }
          this.port.postMessage(buf.buffer, [buf.buffer]);
        }
        return true;
      }
    }
    registerProcessor("pcm-worklet", PCMWorklet);
  `;

  async function iniciar(stream) {
    try {
      const { token } = await api("/medico/transcripcion-token");
      const url = "wss://streaming.assemblyai.com/v3/ws?sample_rate=16000&encoding=pcm_s16le"
        + "&format_turns=true&speech_model=universal-streaming-multilingual&token=" + encodeURIComponent(token);
      ws = new WebSocket(url);

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const blobUrl = URL.createObjectURL(new Blob([CODIGO_WORKLET], { type: "application/javascript" }));
      await audioCtx.audioWorklet.addModule(blobUrl);
      source = audioCtx.createMediaStreamSource(stream);
      workletNode = new AudioWorkletNode(audioCtx, "pcm-worklet");
      source.connect(workletNode);

      let textoAcumulado = "";
      workletNode.port.onmessage = (e) => {
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(e.data);
      };
      ws.onmessage = (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          if (!msg.transcript) return;
          if (msg.end_of_turn) {
            textoAcumulado += msg.transcript + " ";
            onTexto(textoAcumulado);
          } else {
            onTexto(textoAcumulado + msg.transcript);
          }
        } catch {}
      };
      ws.onerror = () => {}; // decorativo — si falla, seguimos grabando igual
    } catch (e) {
      console.warn("Transcripción en vivo no disponible:", e.message);
    }
  }

  function detener() {
    if (workletNode) { try { workletNode.disconnect(); } catch {} }
    if (source) { try { source.disconnect(); } catch {} }
    if (audioCtx) { try { audioCtx.close(); } catch {} }
    if (ws) { try { ws.close(); } catch {} }
    ws = null; audioCtx = null; workletNode = null; source = null;
  }

  return { iniciar, detener };
}

async function api(path, opts = {}) {
  const headers = opts.headers || {};
  if (TOKEN) headers["Authorization"] = "Bearer " + TOKEN;
  const res = await fetch(API + path, { ...opts, headers });
  let data = null;
  try { data = await res.json(); } catch {}
  if (!res.ok) throw { status: res.status, error: (data && data.error) || "Error de conexión" };
  return data;
}

function logout() {
  TOKEN = null; MEDICO_NOMBRE = "";
  localStorage.removeItem("salud_token");
  localStorage.removeItem("salud_nombre");
  btnLogout.style.display = "none";
  headerSub.textContent = "Kardex inteligente";
  renderLogin();
}
btnLogout.onclick = logout;

// ─── LOGIN ───────────────────────────────────────────────────────────────
function renderLogin() {
  detenerPolling();
  app.innerHTML = `
    <div class="card">
      <label>Teléfono</label>
      <input id="lPhone" type="tel" placeholder="591XXXXXXXX">
      <label>Contraseña</label>
      <input id="lPass" type="password" placeholder="••••••••">
      <div id="lErr"></div>
      <button class="primary" id="lBtn">Ingresar</button>
      <button class="link" id="lGoReg">¿No tenés cuenta? Registrate</button>
    </div>`;
  document.getElementById("lGoReg").onclick = renderRegistro;
  document.getElementById("lBtn").onclick = async () => {
    const phone = document.getElementById("lPhone").value.trim();
    const password = document.getElementById("lPass").value;
    const errBox = document.getElementById("lErr");
    errBox.innerHTML = "";
    if (!phone || !password) { errBox.innerHTML = `<div class="error">Completá teléfono y contraseña</div>`; return; }
    try {
      const data = await api("/medico/login", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ phone, password }) });
      TOKEN = data.token; MEDICO_NOMBRE = data.nombre;
      localStorage.setItem("salud_token", TOKEN);
      localStorage.setItem("salud_nombre", MEDICO_NOMBRE);
      renderDashboard();
    } catch (e) {
      errBox.innerHTML = `<div class="error">${esc(e.error || "No se pudo iniciar sesión")}</div>`;
    }
  };
}

// ─── REGISTRO ────────────────────────────────────────────────────────────
function renderRegistro() {
  detenerPolling();
  app.innerHTML = `
    <div class="card">
      <label>Teléfono</label>
      <input id="rPhone" type="tel" placeholder="591XXXXXXXX">
      <label>Nombre completo</label>
      <input id="rNombre" type="text" placeholder="Dra. Fulana Pérez">
      <label>Especialidad (opcional)</label>
      <input id="rEsp" type="text" placeholder="Medicina general">
      <label>Contraseña (mínimo 8 caracteres)</label>
      <input id="rPass" type="password" placeholder="••••••••">
      <div id="rErr"></div>
      <button class="primary" id="rBtn">Registrarme</button>
      <button class="link" id="rGoLogin">Ya tengo cuenta, ingresar</button>
    </div>`;
  document.getElementById("rGoLogin").onclick = renderLogin;
  document.getElementById("rBtn").onclick = async () => {
    const phone = document.getElementById("rPhone").value.trim();
    const nombre = document.getElementById("rNombre").value.trim();
    const especialidad = document.getElementById("rEsp").value.trim();
    const password = document.getElementById("rPass").value;
    const errBox = document.getElementById("rErr");
    errBox.innerHTML = "";
    if (!phone || !nombre || !password) { errBox.innerHTML = `<div class="error">Completá teléfono, nombre y contraseña</div>`; return; }
    try {
      await api("/medico/registro", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ phone, nombre, especialidad, password }) });
      errBox.innerHTML = `<div class="hint">✅ Cuenta creada. Ahora ingresá con tu teléfono y contraseña.</div>`;
      setTimeout(renderLogin, 1200);
    } catch (e) {
      errBox.innerHTML = `<div class="error">${esc(e.error || "No se pudo registrar")}</div>`;
    }
  };
}

// ─── DASHBOARD = LISTA DE PACIENTES ─────────────────────────────────────
async function renderDashboard() {
  detenerPolling();
  headerSub.textContent = "Hola, " + (MEDICO_NOMBRE || "");
  btnLogout.style.display = "inline-block";
  app.innerHTML = `<div class="loading">⏳ Cargando tus pacientes...</div>`;
  try {
    const data = await api("/medico/pacientes");
    const items = data.pacientes || [];
    app.innerHTML = `
      <button class="secondary" id="btnNuevoPaciente">➕ Nuevo paciente</button>
      <button class="link" id="btnVincular" style="margin-top:6px">🔗 Vincular este celular como micrófono</button>
      ${items.length === 0 ? `<div class="empty">Todavía no registraste ningún paciente.</div>` : ""}
      ${items.map(p => {
        const edad = edadDesde(p.fechaNacimiento);
        return `
        <div class="item" data-id="${p._id}">
          <div class="nombre">${esc(p.nombre)}</div>
          <div class="paciente-info">${edad != null ? edad + " años" : ""}${edad != null && p.sexo ? " · " : ""}${esc(p.sexo || "")}</div>
        </div>`;
      }).join("")}
    `;
    document.getElementById("btnNuevoPaciente").onclick = renderNuevoPaciente;
    document.getElementById("btnVincular").onclick = renderVincular;
    document.querySelectorAll(".item").forEach(el => {
      el.onclick = () => renderPacienteDetalle(el.dataset.id);
    });
  } catch (e) {
    if (e.status === 401) return logout();
    app.innerHTML = `<div class="error">${esc(e.error || "Error cargando pacientes")}</div>`;
  }
}

// ─── NUEVO PACIENTE ──────────────────────────────────────────────────────
function renderNuevoPaciente() {
  detenerPolling();
  app.innerHTML = `
    <button class="back" id="btnBack">← Volver</button>
    <div class="card">
      <label>Nombre completo</label>
      <input id="pNombre" type="text" placeholder="Ej: Juan Pérez">
      <label>Fecha de nacimiento (opcional)</label>
      <input id="pFecha" type="date">
      <label>Sexo (opcional)</label>
      <select id="pSexo">
        <option value="">— Sin especificar —</option>
        <option value="Femenino">Femenino</option>
        <option value="Masculino">Masculino</option>
        <option value="Otro">Otro</option>
      </select>
      <label>Teléfono (opcional)</label>
      <input id="pTelefono" type="tel" placeholder="591XXXXXXXX">
      <label>Notas (opcional)</label>
      <input id="pNotas" type="text" placeholder="Alergias, observaciones generales...">
      <div id="pErr"></div>
      <button class="primary" id="pBtn">Guardar paciente</button>
    </div>`;
  document.getElementById("btnBack").onclick = renderDashboard;
  document.getElementById("pBtn").onclick = async () => {
    const nombre = document.getElementById("pNombre").value.trim();
    const fechaNacimiento = document.getElementById("pFecha").value || null;
    const sexo = document.getElementById("pSexo").value;
    const telefono = document.getElementById("pTelefono").value.trim();
    const notas = document.getElementById("pNotas").value.trim();
    const errBox = document.getElementById("pErr");
    errBox.innerHTML = "";
    if (!nombre) { errBox.innerHTML = `<div class="error">El nombre es obligatorio</div>`; return; }
    try {
      const data = await api("/medico/pacientes", {
        method: "POST", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ nombre, fechaNacimiento, sexo, telefono, notas }),
      });
      renderPacienteDetalle(data.paciente._id);
    } catch (e) {
      errBox.innerHTML = `<div class="error">${esc(e.error || "No se pudo guardar el paciente")}</div>`;
    }
  };
}

// ─── DETALLE DE PACIENTE (Kardex con pestañas: Paciente / Consultas) ───
// Trae los datos UNA vez; cambiar de pestaña es instantáneo (sin red),
// para no estar yendo y viniendo cada vez que querés ver otra cosa.
async function renderPacienteDetalle(pacienteId, tabInicial) {
  detenerPolling();
  app.innerHTML = `<div class="loading">⏳ Cargando...</div>`;
  try {
    const data = await api("/medico/pacientes/" + pacienteId);
    pintarKardex(data.paciente, data.consultas || [], data.medicamentos || [], data.vacunas || [], tabInicial || "consultas");
  } catch (e) {
    if (e.status === 401) return logout();
    app.innerHTML = `<div class="error">${esc(e.error || "Error cargando el paciente")}</div>`;
  }
}

function pintarKardex(p, consultas, medicamentos, vacunas, tabActiva) {
  detenerPolling();
  const edad = edadDesde(p.fechaNacimiento);
  const estadoTxt = { procesando: "⏳ Transcribiendo", completado: "✅ Listo", error: "⚠️ Error" };

  const consultasCompletas = consultas.filter(c => c.estado === "completado");
  const ultima = consultas[0]; // ya viene ordenado por fecha descendente
  const ultimaConDx = consultasCompletas.find(c => c.notaClinica && (c.notaClinica.diagnostico || c.notaClinica.motivoConsulta));

  let briefHtml = "";
  if (p.briefClinicoEstado === "generando") {
    briefHtml = `<div class="card"><div class="hint">🧠 Generando brief clínico...</div></div>`;
  } else if (p.briefClinicoEstado === "error") {
    briefHtml = `<div class="card"><div class="error">⚠️ No se pudo generar el brief clínico automático.</div></div>`;
  } else if (p.briefClinicoEstado === "completado" && p.briefClinico) {
    const b = p.briefClinico;
    briefHtml = `
      <div class="card brief-card">
        <div class="nota-titulo">🧠 Brief Clínico Inteligente</div>
        ${b.estadoActual ? `<div class="nota-campo"><b>Estado actual:</b> ${esc(b.estadoActual)}</div>` : ""}
        ${b.cambiosDesdeUltimaConsulta ? `<div class="nota-campo"><b>Cambios desde la última consulta:</b> ${esc(b.cambiosDesdeUltimaConsulta)}</div>` : ""}
        ${(b.medicamentosActivos||[]).length ? `<div class="nota-campo"><b>Medicamentos activos:</b> ${esc(b.medicamentosActivos.join(", "))}</div>` : ""}
        ${(b.examenesPendientes||[]).length ? `<div class="nota-campo"><b>Exámenes pendientes:</b> ${esc(b.examenesPendientes.join(", "))}</div>` : ""}
        ${(b.alertas||[]).length ? `<div class="nota-campo brief-alerta"><b>⚠️ Alertas:</b> ${esc(b.alertas.join(", "))}</div>` : ""}
        ${(b.factoresRiesgo||[]).length ? `<div class="nota-campo"><b>Factores de riesgo:</b> ${esc(b.factoresRiesgo.join(", "))}</div>` : ""}
        ${(b.preguntasSugeridas||[]).length ? `<div class="nota-campo"><b>Preguntas sugeridas:</b> ${esc(b.preguntasSugeridas.join(" · "))}</div>` : ""}

      } catch (e) {
        if (e.status === 401) return logout();

  }

// ─── NUEVA CONSULTA (grabar con onda de voz en vivo, o subir archivo) ──
function renderNuevaConsulta(pacienteId, pacienteNombre) {
  detenerPolling();
  app.innerHTML = `
    <button class="back" id="btnBack">← Volver</button>
    <div class="card">
      <div class="hint" style="margin-bottom:14px">Paciente: <b>${esc(pacienteNombre)}</b></div>

      <div class="listen-panel" id="listenPanel">
        <canvas id="waveCanvas"></canvas>
        <div class="listen-time" id="recTime">00:00</div>
        <div class="listen-label">🎙️ Escuchando la consulta...</div>
        <div class="live-caption" id="liveCaption"></div>
      </div>

      <div class="rec-box">
        <button class="rec-btn" id="recBtn">🎙️</button>
        <div class="rec-status" id="recStatus">Tocá para grabar</div>
      </div>
      <label class="file-label" for="ncFile">📁 O subí un archivo de audio ya grabado</label>
      <input type="file" id="ncFile" accept="audio/*" style="display:none">
      <div id="ncErr"></div>
      <button class="primary" id="ncSubir" style="display:none">Subir y transcribir</button>
      <button class="link" id="btnRemota">💻📱 ¿Esta compu no tiene micrófono? Grabar con el celular vinculado</button>
    </div>`;
  document.getElementById("btnBack").onclick = () => renderPacienteDetalle(pacienteId, "consultas");
  document.getElementById("btnRemota").onclick = () => renderNuevaConsultaRemota(pacienteId, pacienteNombre);

  let mediaRecorder = null, chunks = [], blob = null, mimeType = "audio/webm";
  let seconds = 0, timerId = null;
  const recBtn = document.getElementById("recBtn");
  const recTime = document.getElementById("recTime");
  const recStatus = document.getElementById("recStatus");
  const ncSubir = document.getElementById("ncSubir");
  const ncErr = document.getElementById("ncErr");
  const listenPanel = document.getElementById("listenPanel");
  const liveCaption = document.getElementById("liveCaption");
  const onda = crearVisualizadorOnda(document.getElementById("waveCanvas"));
  const transcriptorVivo = crearTranscriptorEnVivo(texto => { liveCaption.textContent = texto; });

  recBtn.onclick = async () => {
    if (!mediaRecorder || mediaRecorder.state === "inactive") {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const tipos = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
        mimeType = tipos.find(t => MediaRecorder.isTypeSupported(t)) || "";
        mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
        chunks = [];
        mediaRecorder.ondataavailable = e => chunks.push(e.data);
        mediaRecorder.onstop = () => {
          blob = new Blob(chunks, { type: mimeType || "audio/webm" });
          stream.getTracks().forEach(t => t.stop());
          onda.detener();
          transcriptorVivo.detener();
          listenPanel.style.display = "none";
          recStatus.textContent = "Grabación lista (" + fmt(seconds) + ")";
          ncSubir.style.display = "block";
        };
        mediaRecorder.start();
        seconds = 0; recTime.textContent = "00:00"; liveCaption.textContent = "";
        listenPanel.style.display = "block";
        onda.iniciar(stream);
        transcriptorVivo.iniciar(stream);
        timerId = setInterval(() => { seconds++; recTime.textContent = fmt(seconds); }, 1000);
        recBtn.classList.add("recording");
        recBtn.textContent = "⏹️";
        recStatus.textContent = "Grabando... tocá para detener";
        ncSubir.style.display = "none";
      } catch (e) {
        ncErr.innerHTML = `<div class="error">No se pudo acceder al micrófono: ${esc(e.message)}</div>`;
      }
    } else {
      mediaRecorder.stop();
      clearInterval(timerId);
      recBtn.classList.remove("recording");
      recBtn.textContent = "🎙️";
    }
  };

  document.getElementById("ncFile").onchange = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    blob = f; mimeType = f.type || "audio/mpeg";
    recStatus.textContent = "Archivo listo: " + f.name;
    ncSubir.style.display = "block";
  };

  ncSubir.onclick = async () => {
    if (!blob) return;
    ncErr.innerHTML = "";
    ncSubir.disabled = true;
    ncSubir.textContent = "Subiendo audio...";
    try {
      const data = await subirConsulta(pacienteId, blob, mimeType);
      renderDetalle(data.consulta._id);
    } catch (e) {
      // no se pierde la grabación: se puede reintentar sin volver a grabar
      ncSubir.disabled = false;
      ncSubir.textContent = "Reintentar subir";
      ncErr.innerHTML = `<div class="error">${esc(e.error || "No se pudo subir. Revisá tu conexión y volvé a intentar.")}</div>`;
    }
  };
}

// ─── NUEVA CONSULTA — CONTROL REMOTO (desde la compu, graba el celular) ─
// Requiere que el médico ya haya vinculado su celular hoy (ver renderVincular).
async function renderNuevaConsultaRemota(pacienteId, pacienteNombre) {
  detenerPolling();
  app.innerHTML = `<div class="loading">⏳ Cargando...</div>`;
  try {
    const data = await api("/medico/vinculacion");
    pintarControlRemoto(data.vinculacion, pacienteId, pacienteNombre);
  } catch (e) {
    if (e.status === 401) return logout();
    app.innerHTML = `<div class="error">${esc(e.error || "Error cargando la vinculación")}</div>`;
  }
}

function pintarControlRemoto(v, pacienteId, pacienteNombre) {
  let cuerpo = "";
  if (!v.vinculado) {
    cuerpo = `
      <div class="hint" style="margin-bottom:14px">Todavía no vinculaste tu celular hoy. Abrí Vitalis en el celular, tocá "Vincular como micrófono" e ingresá este código:</div>
      <div style="text-align:center;font-size:38px;font-weight:700;letter-spacing:4px;color:var(--primary);padding:18px 0">${esc(v.codigo)}</div>
      <div class="hint">Esta pantalla se actualiza sola apenas lo vincules.</div>`;
  } else if (v.estado === "armado") {
    cuerpo = `
      <div class="hint" style="margin-bottom:14px">📱 Celular vinculado y listo, apoyado con la pantalla prendida.</div>
      <button class="primary" id="btnIniciarRemoto" style="margin-top:0">🎙️ Iniciar grabación remota</button>`;
  } else if (v.estado === "grabando") {
    cuerpo = `
      <div class="listen-panel" style="display:block">
        <div class="listen-label" style="margin-bottom:6px">⏺ Grabando en el celular vinculado...</div>
      </div>
      <button class="primary" id="btnDetenerRemoto" style="margin-top:0;background:var(--danger)">⏹️ Detener grabación</button>`;
  }

  app.innerHTML = `
    <button class="back" id="btnBack">← Volver</button>
    <div class="card">
      <div class="hint" style="margin-bottom:14px">Paciente: <b>${esc(pacienteNombre)}</b></div>
      ${cuerpo}
      <div id="ncrErr"></div>
    </div>`;
  document.getElementById("btnBack").onclick = () => renderPacienteDetalle(pacienteId, "consultas");

  const btnIniciar = document.getElementById("btnIniciarRemoto");
  if (btnIniciar) btnIniciar.onclick = async () => {
    try {
      await api("/medico/vinculacion/comando", {
        method: "POST", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ accion: "iniciar", pacienteId, pacienteNombre }),
      });
      pollTimeout = setTimeout(() => renderNuevaConsultaRemota(pacienteId, pacienteNombre), 1500);
    } catch (e) {
      document.getElementById("ncrErr").innerHTML = `<div class="error">${esc(e.error || "No se pudo mandar la orden")}</div>`;
    }
  };

  const btnDetener = document.getElementById("btnDetenerRemoto");
  if (btnDetener) btnDetener.onclick = async () => {
    try {
      await api("/medico/vinculacion/comando", {
        method: "POST", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ accion: "detener" }),
      });
    } catch (e) { /* seguimos igual esperando a que el celular reporte */ }
  };

  // Auto-refresco: si todavía no está vinculado, o está grabando (esperando
  // que el celular suba y reporte el resultado), seguimos consultando solos.
  if (!v.vinculado || v.estado === "grabando") {
    pollTimeout = setTimeout(async () => {
      try {
        const data = await api("/medico/vinculacion");
        if (data.vinculacion.estado === "armado" && data.vinculacion.consultaId) {
          return renderDetalle(data.vinculacion.consultaId);
        }
        pintarControlRemoto(data.vinculacion, pacienteId, pacienteNombre);
      } catch (e) {
        if (e.status === 401) return logout();
      }
    }, v.vinculado ? 2000 : 3000);
  }
}

// ─── VINCULAR CELULAR COMO MICRÓFONO REMOTO ─────────────────────────────
// Vive en el celular: se ingresa el código del día una vez, y desde ahí
// queda "armado" esperando que la compu mande la orden de grabar.
async function renderVincular() {
  detenerPolling();
  app.innerHTML = `<div class="loading">⏳ Cargando...</div>`;
  try {
    const data = await api("/medico/vinculacion");
    pintarVincular(data.vinculacion);
  } catch (e) {
    if (e.status === 401) return logout();
    app.innerHTML = `<div class="error">${esc(e.error || "Error cargando la vinculación")}</div>`;
  }
}

function pintarVincular(v) {
  if (!v.vinculado) {
    app.innerHTML = `
      <button class="back" id="btnBack">← Volver</button>
      <div class="card">
        <div class="hint" style="margin-bottom:14px">Escribí el código de 6 dígitos que aparece en la compu:</div>
        <input id="vCodigo" type="tel" maxlength="6" placeholder="000000" style="text-align:center;font-size:24px;letter-spacing:6px">
        <div id="vErr"></div>
        <button class="primary" id="vBtn">Vincular</button>
      </div>`;
    document.getElementById("btnBack").onclick = renderDashboard;
    document.getElementById("vBtn").onclick = async () => {
      const codigo = document.getElementById("vCodigo").value.trim();
      const errBox = document.getElementById("vErr");
      errBox.innerHTML = "";
      try {
        const data = await api("/medico/vinculacion/vincular", {
          method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ codigo }),
        });
        pintarVincular(data.vinculacion);
      } catch (e) {
        errBox.innerHTML = `<div class="error">${esc(e.error || "No se pudo vincular")}</div>`;
      }
    };
    return;
  }

  // Ya vinculado: queda "armado" mirando si la compu mandó una orden.
  app.innerHTML = `
    <button class="back" id="btnBack">← Volver</button>
    <div class="card" id="vCard">
      <div class="hint">📱 Celular vinculado. Dejalo con la pantalla prendida al lado de la compu.</div>
      <div class="hint" style="margin-top:10px" id="vEstado">🟢 Esperando la orden de grabar...</div>
    </div>`;
  document.getElementById("btnBack").onclick = renderDashboard;

  let mediaRecorder = null, chunks = [], mimeType = "audio/webm", stream = null;
  let pacienteActual = null;

  async function arrancarGrabacionRemota(pacienteId, pacienteNombre) {
    pacienteActual = { pacienteId, pacienteNombre };
    document.getElementById("vCard").innerHTML = `
      <div class="listen-panel" style="display:block">
        <canvas id="waveCanvasRemoto"></canvas>
        <div class="listen-time" id="recTimeRemoto">00:00</div>
        <div class="listen-label">🎙️ Grabando: ${esc(pacienteNombre)}</div>
      </div>
      <div class="hint" style="text-align:center">Esperando que la compu diga "detener"...</div>
      <button class="secondary" id="btnDetenerLocal">⏹️ Detener acá mismo</button>`;
    const visual = crearVisualizadorOnda(document.getElementById("waveCanvasRemoto"));
    const recTime = document.getElementById("recTimeRemoto");

    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const tipos = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
    mimeType = tipos.find(t => MediaRecorder.isTypeSupported(t)) || "";
    mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
    chunks = [];
    let seconds = 0;
    const timerId = setInterval(() => { seconds++; recTime.textContent = fmt(seconds); }, 1000);
    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    mediaRecorder.onstop = async () => {
      clearInterval(timerId);
      visual.detener();
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, { type: mimeType || "audio/webm" });
      document.getElementById("vCard").innerHTML = `<div class="hint">⏳ Subiendo la grabación...</div>`;
      try {
        const data = await subirConsulta(pacienteActual.pacienteId, blob, mimeType);
        await api("/medico/vinculacion/estado", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ estado: "armado", consultaId: data.consulta._id }),
        });
      } catch (e) {
        await api("/medico/vinculacion/estado", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ estado: "armado" }),
        }).catch(() => {});
      }
      pintarVincular({ vinculado: true, estado: "armado" });
    };
    mediaRecorder.start();
    visual.iniciar(stream);
    document.getElementById("btnDetenerLocal").onclick = () => mediaRecorder.stop();

    await api("/medico/vinculacion/estado", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ estado: "grabando" }),
    }).catch(() => {});
  }

  (async function ciclo() {
    try {
      const data = await api("/medico/vinculacion");
      const vv = data.vinculacion;
      if (!vv.vinculado) return renderVincular(); // se desvinculó (cambió el día)

      if (vv.comandoPendiente?.accion === "iniciar" && (!mediaRecorder || mediaRecorder.state === "inactive")) {
        await arrancarGrabacionRemota(vv.comandoPendiente.pacienteId, vv.comandoPendiente.pacienteNombre);
      } else if (vv.comandoPendiente?.accion === "detener" && mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
      }
    } catch (e) {
      if (e.status === 401) return logout();
    }
    pollTimeout = setTimeout(ciclo, 1500);
  })();
}

// ─── DETALLE DE CONSULTA: transcripción + nota clínica generada por IA ──
// Mientras la transcripción o la nota clínica siguen en camino, esta
// pantalla se refresca sola cada 8s hasta que ambas terminan.
async function renderDetalle(id, esRefrescoAutomatico) {
  detenerPolling();
  if (!esRefrescoAutomatico) app.innerHTML = `<div class="loading">⏳ Cargando...</div>`;
  try {
    const data = await api("/medico/consultas/" + id);
    const c = data.consulta;

    let notaHtml = "";
    if (c.estado === "completado") {
      if (c.notaClinicaEstado === "pendiente") {
        notaHtml = `<div class="card"><div class="hint">🧠 Generando nota clínica...</div></div>`;
      } else if (c.notaClinicaEstado === "error") {
        notaHtml = `<div class="card"><div class="error">⚠️ No se pudo generar la nota clínica automática. La transcripción completa queda más abajo.</div></div>`;
      } else if (c.notaClinica) {
        const n = c.notaClinica;
        const meds = (n.medicamentosRecetados || []).map(m =>
          esc(m.nombre + (m.dosis ? " " + m.dosis : "") + (m.frecuencia ? " — " + m.frecuencia : ""))
        ).join("; ");
        notaHtml = `
          <div class="card">
            <div class="nota-titulo">🧠 Nota clínica generada por IA (revisar antes de usar)</div>
            ${n.motivoConsulta ? `<div class="nota-campo"><b>Motivo:</b> ${esc(n.motivoConsulta)}</div>` : ""}
            ${(n.sintomas||[]).length ? `<div class="nota-campo"><b>Síntomas:</b> ${esc(n.sintomas.join(", "))}</div>` : ""}
            ${n.antecedentesRelevantes ? `<div class="nota-campo"><b>Antecedentes:</b> ${esc(n.antecedentesRelevantes)}</div>` : ""}
            ${n.diagnostico ? `<div class="nota-campo"><b>Diagnóstico:</b> ${esc(n.diagnostico)}</div>` : ""}
            ${(n.diagnosticosDiferenciales||[]).length ? `<div class="nota-campo"><b>Diferenciales:</b> ${esc(n.diagnosticosDiferenciales.join(", "))}</div>` : ""}
            ${n.plan ? `<div class="nota-campo"><b>Plan:</b> ${esc(n.plan)}</div>` : ""}
            ${meds ? `<div class="nota-campo"><b>Medicamentos:</b> ${meds}</div>` : ""}
            ${(n.examenesSolicitados||[]).length ? `<div class="nota-campo"><b>Exámenes:</b> ${esc(n.examenesSolicitados.join(", "))}</div>` : ""}
            ${n.proximoControl ? `<div class="nota-campo"><b>Próximo control:</b> ${esc(n.proximoControl)}</div>` : ""}
          </div>`;
      }
    }

    let body = "";
    if (c.estado === "procesando") {
      body = `<div class="hint">⏳ Transcribiendo tu consulta... para audios largos puede tardar varios minutos. Esta pantalla se actualiza sola, no hace falta que hagas nada.</div>`;
    } else if (c.estado === "error") {
      body = `<div class="error">⚠️ ${esc(c.error || "Ocurrió un error al transcribir")}</div>`;
    } else if (c.segmentos && c.segmentos.length) {
      body = `<div class="seccion-titulo">Transcripción</div>` + c.segmentos.map(s => `
        <div class="segmento h${s.hablante && s.hablante.charCodeAt(0) % 2}">
          <div class="quien">Hablante ${esc(s.hablante)}</div>
          <div class="texto">${esc(s.texto)}</div>
        </div>`).join("");
    } else {
      body = `<div class="hint">${esc(c.transcripcionCompleta || "Sin transcripción")}</div>`;
    }

    app.innerHTML = `
      <button class="back" id="btnBack">← Volver</button>
      <div class="card">
        <div class="nombre" style="font-size:16px;font-weight:600">${esc(c.pacienteNombre || "Sin nombre de paciente")}</div>
        <div class="fecha">${new Date(c.createdAt).toLocaleString("es-BO")}${c.duracionSegundos ? " · " + Math.round(c.duracionSegundos/60) + " min" : ""}</div>
      </div>
      ${notaHtml}
      <div style="margin-top:14px">${body}</div>
    `;
    document.getElementById("btnBack").onclick = () => renderPacienteDetalle(c.pacienteId, "consultas");

    if (c.estado === "procesando" || (c.estado === "completado" && c.notaClinicaEstado === "pendiente")) {
      pollTimeout = setTimeout(() => renderDetalle(id, true), 8000);
    }
  } catch (e) {
    if (e.status === 401) return logout();
    app.innerHTML = `<div class="error">${esc(e.error || "Error cargando la consulta")}</div>`;
  }
}

// ─── ARRANQUE ────────────────────────────────────────────────────────────
if (TOKEN) renderDashboard(); else renderLogin();
